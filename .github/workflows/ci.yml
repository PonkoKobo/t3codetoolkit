name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The desktop installer writes different things on each OS, so all three run it.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # zlib.crc32 (used by the packager) needs 22.2+
          cache: npm
      - run: npm ci
      - run: npm run package
      - run: npm test
      - name: Upload release zips
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          overwrite: true

  release:
    name: Draft GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Create draft with install downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag_object=$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME" --jq '.object | select(.type == "tag") | .sha')
          if [[ -z "$tag_object" ]]; then
            echo "::error::Use an annotated tag with a short user-facing release note."
            exit 1
          fi
          summary=$(gh api "repos/$GH_REPO/git/tags/$tag_object" --jq '.message | split("\n")[0]')
          if [[ ! "$summary" =~ [^[:space:]] ]]; then
            echo "::error::Start the tag message with a short user-facing release note."
            exit 1
          fi
          install_notes=$(cat <<'EOF'
          ## Install

          - **Desktop** — Extract the desktop ZIP and run `install.cmd` on Windows, `install.command` on macOS, or `./install.sh` on Linux. Then start **T3 Code + Toolkit**.
          - **Chrome and Edge** — Download the ZIP labeled for your browser and extract it. In `chrome://extensions` or `edge://extensions`, enable Developer mode and use **Load unpacked** to select the extracted folder.
          - **Firefox** — Download the Firefox ZIP and select it with **Load Temporary Add-on** in `about:debugging#/runtime/this-firefox`. Repeat after each Firefox restart.
          - **Desktop updates** — Quit T3 Code, run the new installer, and use the same shortcut.
          EOF
          )
          notes=$(printf "## What's new\n\n%s\n\n%s" "$summary" "$install_notes")
          gh release create "$GITHUB_REF_NAME" \
            "release/T3CodeToolkit-$version.zip#Desktop installer (Windows, macOS, Linux)" \
            "release/T3CodeToolkit-extension-chrome-$version.zip#Chrome extension" \
            "release/T3CodeToolkit-extension-edge-$version.zip#Microsoft Edge extension" \
            "release/T3CodeToolkit-extension-firefox-$version.zip#Firefox extension (temporary install)" \
            release/SHA256SUMS.txt \
            --draft --verify-tag --title "T3CodeToolkit $version" --notes "$notes" --generate-notes
