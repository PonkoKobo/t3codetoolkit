name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The desktop installer writes different things on each OS, so all three run it.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # zlib.crc32 (used by the packager) needs 22.2+
          cache: npm
      - run: npm ci
      - run: npm run package
      - run: npm test
      - name: Upload release zips
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/*.zip
          if-no-files-found: error
